<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hw9</title>
    <link rel="stylesheet" href="style.css.hw9.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page">
        <h1 class="header">Этот заголовок можно скрыть!</h1>
        <button class="button">Скрыть</button>
        <p class="paragraph" id="colorParagraph">
            Этот абзац изменит свой цвет при нажатии на кнопку ниже.
        </p>
        <button class="button button-secondary" id="changeColorBtn">
            Изменить цвет
        </button>
        <h1 class="header1" id="changeableHeader">Оригинальный текст</h1>
        <button class="button button-success" id="changeTextBtn">
            Изменить текст
        </button>
        <div class="section-title">Элементы с классом "description"</div>
        <div class="description-container">
            <p class="description">Первый элемент описания</p>
            <p class="description">Второй элемент описания</p>
            <p class="description">Третий элемент описания</p>
            <p class="description">Четвертый элемент описания</p>
        </div>
        <button class="button button-warning" id="changeDescriptionBtn">
            Изменить все описания
        </button>
        <button class="button button-secondary" id="resetDescriptionBtn" style="margin-top: 8px;">
            Сбросить описания
        </button>
    </div>
    <script src="script.js.hw9.js"></script>
</body>
</html>
